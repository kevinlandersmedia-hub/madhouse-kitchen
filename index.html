<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<meta name="theme-color" content="#e0703a">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Kitchen</title>
<link rel="apple-touch-icon" id="touchIcon" href="">
<link rel="icon" id="favIcon" href="">
<link rel="manifest" id="manifest" href="">
<style>
  html,body{margin:0;height:100%;background:#f5f5f7;overflow:hidden}
  @media (prefers-color-scheme: dark){html,body{background:#000}}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;
    padding-top:env(safe-area-inset-top);box-sizing:border-box;background:inherit}
  .msg{font:16px -apple-system,system-ui,sans-serif;padding:40px 24px;max-width:420px;margin:auto;color:#6e6e73;text-align:center}
</style>
</head>
<body>
<script>
/* Madhouse Kitchen — home-screen wrapper for the standalone repo
   kevinlandersmedia-hub/madhouse-kitchen (GitHub Pages).
   Link: https://kevinlandersmedia-hub.github.io/madhouse-kitchen/?k=<Kitchen key>
   Uses Kitchen's OWN personal keys (run showKeys in the Apps Script editor).
   Separate from the Madhouse family app on purpose. */
(function(){
  var APP = 'https://script.google.com/macros/s/AKfycbwrJCSBAvQSryvIVcgamnzaYc2YPWqCXv9QxSEh97DmqdU1e-DFysqb8eKGxvpLC3GG/exec';
  var q = new URLSearchParams(location.search), key = q.get('k') || '';
  if (!/^[0-9a-f]{40}$/.test(key)) {
    document.body.innerHTML = '<div class="msg">This link is missing its personal Kitchen key. Ask Kevin for your link.</div>';
    return;
  }
  function icon(size){
    var cv = document.createElement('canvas'); cv.width = cv.height = size;
    var ctx = cv.getContext('2d'), g = ctx.createLinearGradient(0,0,size,size);
    g.addColorStop(0,'#f08a4b'); g.addColorStop(1,'#b8541f');
    ctx.fillStyle = g; ctx.fillRect(0,0,size,size);
    ctx.font = Math.round(size*0.58) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🍳', size/2, size*0.54);
    return cv.toDataURL('image/png');
  }
  try {
    document.getElementById('touchIcon').href = icon(180);
    document.getElementById('favIcon').href = icon(64);
    var manifest = { name: 'Kitchen', short_name: 'Kitchen', start_url: location.href, scope: location.href.split('?')[0],
      display: 'standalone', background_color: '#000000', theme_color: '#e0703a',
      icons: [{ src: icon(192), sizes: '192x192', type: 'image/png' }, { src: icon(512), sizes: '512x512', type: 'image/png' }] };
    document.getElementById('manifest').href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
  } catch (e) {}
  var f = document.createElement('iframe');
  f.src = APP + '?k=' + key;
  f.title = 'Kitchen';
  f.allow = 'clipboard-write';
  document.body.appendChild(f);
})();
</script>
</body>
</html>
